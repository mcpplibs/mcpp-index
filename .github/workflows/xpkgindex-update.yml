name: xpkgindex-update

on:
  schedule:
    - cron: "17 2 * * *" # Daily 02:17 UTC (11:17 JST).
  pull_request:
    paths:
      - 'pkgs/**/*.lua'
      - 'tests/autoupdate/**'
      - '.github/xpkgindex-update.yml'
      - '.github/workflows/xpkgindex-update.yml'
  workflow_dispatch:
    inputs:
      package:
        description: "Optional namespace:name; empty scans all declared packages"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: xpkgindex-update-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUTF8: '1'
  MCPP_VERSION: '2026.10.24.1'
  MCPP_INDEX_MIRROR: GLOBAL

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: openxlings/xpkgindex-update
          ref: 6c0bee2941e36132bc2ac3d1f7edbef8b5790320
          path: .updater
          persist-credentials: false
      - name: Use the pinned updater source
        run: echo "PYTHONPATH=$PWD/.updater/src" >> "$GITHUB_ENV"
      - name: All GitHub-direct descriptors are declared; published versions are preserved
        id: coverage
        env:
          BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: |
          python -m unittest discover -s tests/autoupdate -p 'test_*.py'
          python tests/autoupdate/ci.py audit --base "$BASE" --output coverage.json
          python tests/autoupdate/ci.py selection --base "$BASE" --output selected-package.txt
          echo "package=$(cat selected-package.txt)" >> "$GITHUB_OUTPUT"
      # A PR tests the versions in its diff. Discovering future upstream
      # releases here also tested unrelated packages on a packaging-only PR.
      # matrix() derives every added version from the diff, including PRs that
      # change more than one descriptor. Scheduled/manual scans remain global.
      - name: Prepare the PR candidate plan
        id: pr-plan
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          Path("build-plan.json").write_text(json.dumps({
              "format": 1, "adapter": "mcpp-index",
              "base_commit": os.environ["GITHUB_SHA"], "packages": [],
          }))
          PY
          echo "plan=build-plan.json" >> "$GITHUB_OUTPUT"
      - name: Discover and download real upstream candidates
        id: scan
        if: github.event_name != 'pull_request'
        continue-on-error: true # The mandatory gate below accepts only the approved source outage.
        uses: openxlings/xpkgindex-update@6c0bee2941e36132bc2ac3d1f7edbef8b5790320
        with:
          mode: check
          token: ${{ github.token }}
          package: ${{ inputs.package || steps.coverage.outputs.package }}
      - name: Reject all scan failures except the approved unavailable source
        if: always() && steps.scan.outcome != 'skipped'
        env:
          PLAN: ${{ steps.scan.outputs.plan }}
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          if [[ -z "$PLAN" ]]; then
            echo "::error::the updater scan produced no plan; inspect the previous step"
            exit 1
          fi
          python tests/autoupdate/source_outage.py scan-gate --plan "$PLAN" --outcome "$OUTCOME"
      - name: Plan actual candidate build/run jobs
        id: matrix
        if: always() && (steps.pr-plan.outputs.plan != '' || steps.scan.outputs.plan != '')
        env:
          PLAN: ${{ steps.pr-plan.outputs.plan || steps.scan.outputs.plan }}
          BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: |
          python tests/autoupdate/ci.py matrix --plan "$PLAN" --base "$BASE" --output matrix.json
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xpkgindex-update-build-plan
          path: build-plan.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xpkgindex-update-coverage
          path: |
            coverage.json
            matrix.json

  candidate:
    name: candidate (${{ matrix.id }} ${{ matrix.candidate }}, ${{ matrix.platform }}, ${{ matrix.toolchain }})
    needs: scan
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'pull_request' || github.ref_name != github.event.repository.default_branch) &&
      needs.scan.outputs.matrix != '' && needs.scan.outputs.matrix != '{"include": []}'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.scan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: openxlings/xpkgindex-update
          ref: 6c0bee2941e36132bc2ac3d1f7edbef8b5790320
          path: .updater
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: xpkgindex-update-build-plan
          path: .candidate-plan
      - name: Use the pinned updater and a standalone consumer
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            echo "PYTHONPATH=$(cygpath -m "$PWD/.updater/src")" >> "$GITHUB_ENV"
            echo "CONSUMER=$(cygpath -m "$RUNNER_TEMP/candidate-consumer")" >> "$GITHUB_ENV"
            echo "CANDIDATE_MCPP_HOME=$(cygpath -m "$HOME/.mcpp")" >> "$GITHUB_ENV"
          else
            echo "PYTHONPATH=$PWD/.updater/src" >> "$GITHUB_ENV"
            echo "CONSUMER=$RUNNER_TEMP/candidate-consumer" >> "$GITHUB_ENV"
            echo "CANDIDATE_MCPP_HOME=$HOME/.mcpp" >> "$GITHUB_ENV"
          fi
      - name: Append the candidate and prepare its existing consumer test
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ matrix.id }}
        run: |
          python -m xpkgindex_update apply --plan .candidate-plan/build-plan.json --package "$PACKAGE"
          python tests/autoupdate/ci.py prepare --plan .candidate-plan/build-plan.json --package "$PACKAGE" --output "$CONSUMER" --home "$CANDIDATE_MCPP_HOME"
          git diff -- pkgs
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.mcpp/registry
            !~/.mcpp/registry/data/xim-pkgindex
            !~/.mcpp/registry/data/mcpplibs
          key: candidate-${{ runner.os }}-${{ matrix.toolchain }}-${{ env.MCPP_VERSION }}-${{ github.run_id }}
          restore-keys: |
            mcpp-registry-${{ runner.os }}-${{ matrix.toolchain }}-${{ env.MCPP_VERSION }}-
      - name: Install the same mcpp release as index validation
        shell: bash
        env:
          SUFFIX: ${{ matrix.suffix }}
          EXT: ${{ matrix.ext }}
        run: |
          root="mcpp-${MCPP_VERSION}-${SUFFIX}"
          archive="$RUNNER_TEMP/$root.$EXT"
          curl -fsSL --retry 2 -o "$archive" "https://github.com/mcpp-community/mcpp/releases/download/v${MCPP_VERSION}/$root.$EXT"
          if [[ "$EXT" == zip ]]; then
            powershell -NoProfile -Command "Expand-Archive -Force -Path '$archive' -DestinationPath '$RUNNER_TEMP'"
          else
            tar -xzf "$archive" -C "$RUNNER_TEMP"
          fi
          root="$RUNNER_TEMP/$root"
          mkdir -p "$HOME/.mcpp/registry"
          cp -a "$root/registry/." "$HOME/.mcpp/registry/"
          echo "MCPP_HOME=$CANDIDATE_MCPP_HOME" >> "$GITHUB_ENV"
          if [[ "$RUNNER_OS" == Windows ]]; then
            echo "MCPP=$(cygpath -m "$root/bin/mcpp.exe")" >> "$GITHUB_ENV"
          else
            echo "MCPP=$root/bin/mcpp" >> "$GITHUB_ENV"
          fi
      - name: Install macOS ODBC development headers
        if: runner.os == 'macOS' && matrix.id == 'compat:nanodbc'
        run: brew install libiodbc
      - name: Resolve, build and run the actual candidate
        shell: bash
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
          PACKAGE: ${{ matrix.id }}
        run: |
          "$MCPP" index update
          # Refresh replaces the candidate with the published snapshot.
          # Apply the candidate last, to both descriptor reader and installer.
          python tests/prepare_builtin_index.py --home "$MCPP_HOME"
          if [[ "$TOOLCHAIN" != default ]]; then
            "$MCPP" toolchain install "$TOOLCHAIN"
            "$MCPP" toolchain default "$TOOLCHAIN"
          fi
          cd "$CONSUMER"
          "$MCPP" test --verbose 2>&1 | tee candidate.log
      - name: The lockfile proves the candidate was selected
        shell: bash
        env:
          PACKAGE: ${{ matrix.id }}
        run: python tests/autoupdate/ci.py verify --plan .candidate-plan/build-plan.json --package "$PACKAGE" --consumer "$CONSUMER"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-${{ strategy.job-index }}
          path: |
            ${{ env.CONSUMER }}/candidate.log
            ${{ env.CONSUMER }}/mcpp.lock
            ${{ env.CONSUMER }}/mcpp.toml
      - name: Collect compiler and linker evidence
        if: always()
        shell: bash
        run: python tests/autoupdate/ci.py diagnostics --consumer "$CONSUMER" --output candidate-diagnostics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-diagnostics-${{ strategy.job-index }}
          path: candidate-diagnostics
          if-no-files-found: ignore

  propose:
    # PR validation and dispatches on update branches can never create more PRs.
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.ref_name == github.event.repository.default_branch
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      actions: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: openxlings/xpkgindex-update
          ref: 6c0bee2941e36132bc2ac3d1f7edbef8b5790320
          path: .updater
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: xpkgindex-update-plan
          path: .update-plan
      - name: Create bot PRs from the fixed scan plan and dispatch their CI
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          export PYTHONPATH="$PWD/.updater/src"
          git switch -C "$DEFAULT_BRANCH" "$GITHUB_SHA"
          python tests/autoupdate/automation.py propose \
            --plan .update-plan/xpkgindex-update-plan.json --output automation-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xpkgindex-update-proposals
          path: |
            automation-report.json
            proposals.json
