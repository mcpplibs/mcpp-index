# Temporary probe (closed after it answers): which mcpp version makes the Windows
# archive members crash at start (exit 133), and where.
name: probe-windows-archive
on:
  pull_request:
    paths: ['.github/workflows/probe-windows-archive.yml']
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mcpp: ["2026.11.5.1", "2026.11.7.1", "2026.11.7.2", "2026.11.8.1", "2026.11.9.1", "2026.11.10.1", "2026.11.10.2", "2026.11.12.1"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: mcpp ${{ matrix.mcpp }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 -o m.zip "https://github.com/mcpp-community/mcpp/releases/download/v${{ matrix.mcpp }}/mcpp-${{ matrix.mcpp }}-windows-x86_64.zip"
          unzip -q m.zip
          echo "$PWD/mcpp-${{ matrix.mcpp }}-windows-x86_64/bin" >> "$GITHUB_PATH"
          echo "MCPP_HOME=$HOME/.mcpp-probe" >> "$GITHUB_ENV"
      - name: the archive member
        continue-on-error: true
        run: |
          mcpp --version
          mcpp test -p archive-tests --toolchain llvm@23.1.3 2>&1 | tail -40
      - name: the crash, under cdb
        continue-on-error: true
        run: |
          set +e
          cdb="/c/Program Files (x86)/Windows Kits/10/Debuggers/x64/cdb.exe"
          ls "$cdb" || true
          for exe in $(find target -name 'versions*.exe' -o -name 'compression*.exe' | head -4); do
            echo "== $exe"
            "$exe"; printf 'exit status %d (0x%08X)\n' $? $?
            "$cdb" -g -G -o -c ".lastevent; r; kn 30; lm; q" "$exe" 2>&1 | tail -80
          done
      - name: the link and compile lines
        continue-on-error: true
        run: |
          set +e
          for f in $(find target -name 'build.ninja' | head -3); do
            echo "== $f"
            grep -n 'compression' "$f" | head -20 | cut -c1-2000
          done
          for f in $(find target -name '*.rsp' | grep -i 'compression' | head -3); do echo "== $f"; cat "$f" | tr ' ' '\n' | head -120; done
