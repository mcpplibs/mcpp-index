# Temporary probe (closed after it answers): (1) does MSVC's link.exe keep a
# locally defined function reached only through an __imp_ slot under /OPT:REF,
# where lld-link collects it; (2) do compat.xz and compat.libarchive stating their static-API macros for
# their consumers (a default-implied feature) end the archive members' crash.
name: probe-windows-archive
on:
  pull_request:
    paths: ['.github/workflows/probe-windows-archive.yml']
jobs:
  archive:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: mcpp 2026.11.21.1
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 -o m.zip "https://github.com/mcpp-community/mcpp/releases/download/v2026.11.21.1/mcpp-2026.11.21.1-windows-x86_64.zip"
          unzip -q m.zip
          echo "$PWD/mcpp-2026.11.21.1-windows-x86_64/bin" >> "$GITHUB_PATH"
          echo "MCPP_HOME=$HOME/.mcpp-probe" >> "$GITHUB_ENV"
      - name: the archive members with LZMA_API_STATIC and LIBARCHIVE_STATIC
        run: |
          set +e
          for p in archive-tests libarchive-bundle; do
            echo "== $p"
            mcpp test -p "$p" --toolchain llvm@23.1.3 2>&1 | tail -25
            echo "RESULT $p exit=${PIPESTATUS[0]}"
          done
          exit 0
