[package]
name = "opencv-cpu"
version = "5.0.0.1"
description = "Install the OpenCV mwrap archive and run a generated image pipeline"

[indices]
# Use the complete candidate built-in index prepared by tests/run_members.sh.
# An explicit empty table overrides the legacy workspace redirect.

[dependencies]
"mcpplibs.mwrap.opencv" = { version = "5.0.0.1", features = ["imgproc", "imgcodecs-png", "imgcodecs-jpeg"] }
