[package]
name = "opencv-cpu"
version = "5.0.0.1"
description = "Install the OpenCV mwrap archive and run a generated image pipeline"

[indices]
"mcpplibs.mwrap" = { path = "../.indices/mcpplibs.mwrap" }

[dependencies]
"mcpplibs.mwrap.opencv" = { version = "5.0.0.1", features = ["imgproc", "imgcodecs-png", "imgcodecs-jpeg"] }
