[package]
name = "opus-ogg"
version = "1.6.1"
description = "Consume the immutable Opus wrapper: a chord encoded with libopus, paged with libogg and read back with opusfile from memory (headers, tags, exact length, seeking), the typed CTL requests, a 5.1 multistream frame, the side header beside the import"

[indices]
# Use the complete candidate built-in index prepared by tests/run_members.sh.
# An explicit empty table overrides the legacy workspace redirect.

[dependencies]
"mcpplibs.mwrap.opus" = "1.6.1"
