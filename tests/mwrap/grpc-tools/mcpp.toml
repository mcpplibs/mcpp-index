[package]
name = "grpc-tools"
version = "1.83.0.1"
description = "Resolve the indexed gRPC plugin and host rule, and verify the built host binary"

[indices]
# Use the complete candidate built-in index prepared by tests/run_members.sh.
# An explicit empty table overrides the legacy workspace redirect.

[dependencies]
"grpc.grpc-plugin" = { version = "1.83.0.1", tools = ["grpc_cpp_plugin"] }

[build-dependencies]
"mcpplibs.grpcgen" = { version = "1.83.0.1", host-module = true }
