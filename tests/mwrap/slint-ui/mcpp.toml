[package]
name = "slint-ui"
version = "1.19.0.2"
description = "Consume the immutable Slint wrapper: the runtime types and the interpreter through the modules, a .slint file compiled by mcpp.mcpplibs.slintgen into the module app.ui, a component driven headless, the features as constants"

[language]
standard   = "c++23"
modules    = true
import_std = false

[indices]
# Use the complete candidate built-in index prepared by tests/run_members.sh.
# An explicit empty table overrides the legacy workspace redirect.

[dependencies]
# The wrapper re-exports the build rule (module mcpp.mcpplibs.slintgen) and the
# SDK: this is the whole dependency list.
mcpplibs.mwrap.slint = "1.19.0.2"

[build]
sources = ["src/*.cpp"]

[targets.slint-ui]
kind = "bin"
main = "src/main.cpp"
