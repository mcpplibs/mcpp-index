# The test projects measured on openkal, and the ones deliberately not measured.
#
# A member is listed here, rather than every member being measured, because a
# measurement takes minutes per target. The list grows by adding a line; a
# member's label on the site comes from its measurement and not from this file.

[members]
cjson          = "JSON parsing, C"
yyjson         = "JSON parsing, C"
"nlohmann.json" = "JSON, header-only C++"
yaml-cpp       = "YAML parsing and emitting, C++ (0.9.0)"
yaml-cpp-v080  = "YAML parsing and emitting, C++ (0.8.0)"
expat          = "XML parsing, C"
pcre2          = "regular expressions, C"
re2            = "regular expressions, C++"
md4c           = "Markdown parsing, C"
xxhash         = "hashing, C"
brotli         = "compression, C"
zlib           = "compression, C; its configuration differs on Windows with musl"
gzip-hpp       = "compression, C++ over compat.zlib"
archive        = "archive formats, C (libarchive)"
"fmtlib.fmt"   = "formatting, C++"
spdlog         = "logging, C++, threads and files"
cli11          = "command lines, C++"
argparse       = "command lines, C++"
cmdline        = "command lines, C++ modules"
"magic_enum"   = "reflection, header-only C++"
glm            = "mathematics, header-only C++"
eigen          = "linear algebra, header-only C++"
catch2         = "testing framework, C++"
doctest        = "testing framework, C++"
sqlite3        = "database, C, file locks"
capi-lua       = "interpreter, C"
mimalloc       = "allocator, C, address space"
libpng         = "image codec, C over zlib"
c-ares         = "name resolution, C, sockets"
curl           = "HTTP client, C, sockets"
tinyhttps      = "HTTPS client, C++ modules, sockets"
cmp-module     = "coroutines, C++ modules"

# A member that cannot be built FOR ONE TARGET by construction, with the reason
# and the evidence. It is measured anyway, and `compat.py check` FAILS if a
# declared cell builds --- a declaration nothing can contradict is a permanent
# excuse, and this project has shipped one of those before.
#
# DISTINCT FROM `[excluded]` BELOW, which is whole-member. `cmp-module` runs on
# `x86_64-windows-musl`; excluding it would discard a result that is true in
# order to hide one that is also true.
#
# THE BAR IS "NO MANIFEST KEY REACHES IT". A generated configuration header
# this index writes is a RECIPE DEFECT and belongs in the recipe, not here ---
# `curl`'s `linux/tcp.h` is exactly that, `#define HAVE_LINUX_TCP_H 1` inside
# `#if defined(__linux__)` in `pkgs/c/compat.curl.lua`. What qualifies is
# upstream source that asks in the preprocessor where no key can answer.
[not-portable.curl]
# Both targets, one cause: this graph supplies no TLS provider, and the member's
# own test refuses a curl without one -- transfer.cpp:45 fails when
# CURL_VERSION_SSL is clear, because "a curl built with no SSL still links and
# still runs, it just silently cannot do https".
x86_64-linux-gnu = "curl's TLS backend here is compat.openssl, which builds through OpenSSL's own Configure from an install() hook and is therefore a glibc artefact: it declares provides = [\"platform-sdk\"] and fails this graph's link at setcontext and __isoc23_strtol, which musl does not have. Building OpenSSL inside the graph would change this cell."
x86_64-windows-musl = "curl's Windows configuration is Schannel plus the checked-in lib/config-win32.h, and both are selected by _WIN32, which a C library presenting POSIX on Windows does not define. With neither HAVE_CONFIG_H nor _WIN32, curl_setup.h reads no configuration at all and stops at curl_setup.h:591 'too small curl_off_t', which names a consequence and not the cause. compat.openssl has no Windows build, so there is no second TLS provider to fall back to."

[not-portable.cmp-module]
x86_64-linux-gnu = "asio's detail/config.hpp:899 includes <linux/version.h> whenever __linux__ is defined, OUTSIDE every ASIO_DISABLE_* guard, so no configuration macro prevents it. openkal runs on the Linux kernel, so __linux__ is correct; the uapi headers glibc's userspace installs beside it are not part of what openkal presents."

# Members that are not measured, each with the reason. A member belongs here
# when it cannot be built in any openkal graph, not when it fails: a failure is
# measured and published.
[excluded]
build-mcpp     = "builds the build tool itself, a host program"
grpc-codegen   = "runs host code generators"
protobuf-protoc = "runs a host code generator"
cuda-curand    = "a GPU vendor runtime distributed as binaries for the platform C runtime"
cuda-driver    = "a GPU vendor runtime distributed as binaries for the platform C runtime"
sycl-runtime   = "a vendor runtime distributed as binaries for the platform C runtime"
