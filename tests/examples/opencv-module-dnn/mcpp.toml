# Public `opencv` module package `dnn` FEATURE test: `opencv = { features =
# ["dnn"] }` builds the underlying dnn sources and compiles opencv-m's
# opencv.dnn interface, so `import opencv.dnn;` is available. All three
# platforms (mlas on linux/macOS, built-in fast_gemm on windows).
# Overrides the workspace-root redirect: root declares `compat`, this member
# needs `default`. A member-level [indices] REPLACES the inherited table rather
# than merging with it, which is what keeps this to ONE project index repo —
# two repos pointing at the same tree make every lookup ambiguous.
[indices]
opencv = { path = "../../.." }

[package]
name    = "opencv-module-dnn-tests"
version = "0.1.0"

[target.'cfg(linux)'.dependencies.opencv]
opencv = { version = "5.0.0", features = ["dnn"] }

# macOS: `import opencv.dnn;` on macOS-arm64 (per-OS NEON dnn payload).
[target.'cfg(macos)'.dependencies.opencv]
opencv = { version = "5.0.0", features = ["dnn"] }

# windows: `import opencv.dnn;` on windows-x86_64 (fast_gemm backend).
[target.'cfg(windows)'.dependencies.opencv]
opencv = { version = "5.0.0", features = ["dnn"] }


