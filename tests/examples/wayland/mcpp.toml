# wayland test member.
#
# THIS MEMBER DECLARES ITS OWN [indices], and has to. The workspace root maps
# the `compat` namespace to this checkout, and an index is looked up BY
# NAMESPACE — so `freedesktop.*` would resolve against the published index
# rather than the packages under test. A member-level table REPLACES the root's
# rather than merging, which is what keeps this to one repo per member; the
# transitive `compat.libffi` these packages need therefore comes from the
# published index, which is correct: it is published.
[indices]
freedesktop = { path = "../../.." }

[package]
name     = "wayland-tests"
version  = "0.1.0"
standard = "c++23"

# Two packages, not one with an ldflags escape hatch. The client and the server
# are distinct SONAMEs — Mesa's libEGL_mesa carries DT_NEEDED on both — so they
# are two libraries with disjoint contents, and a compositor asks for the one it
# needs by name.
#
# wayland-util is the third: wayland's public MACROS, which no module can
# export, mapped to the entities they actually are.
[target.'cfg(linux)'.dependencies.freedesktop]
wayland        = "1.26.0"
wayland-server = "1.26.0"
wayland-util   = "1.26.0"
