# wayland test member.
#
# Two packages now, not one with an ldflags escape hatch: the client and the
# server are distinct SONAMEs (Mesa's libEGL_mesa has DT_NEEDED on both), so
# they are two packages, and a compositor asks for the one it needs by name.
#
# Both also ship a C++23 module wrapper, and the test uses BOTH spellings —
# `#include <wayland-client.h>` and `import wayland.client;` — because the
# whole claim of the module layer is that they are the same entities.
[package]
name = "wayland-tests"
version = "0.1.0"
standard = "c++23"

[target.'cfg(linux)'.dependencies.freedesktop]
wayland        = "1.26.0"
wayland-server = "1.26.0"
wayland-util   = "1.26.0"
