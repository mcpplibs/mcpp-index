# openkal-bind test project: a library published as an ok image and a C header,
# called from a program of this system through the binding mcpplibs.openkal-bind
# generates (openkal-image docs/bind.md), on every runner.
#
# The image is built by this member's build.mcpp, with okld from openkal-tools
# (which builds openkal-ld and openkal-run from the same archive) and the clang
# of `xim:llvm'. The test calls the image, and the image calls back into it.
[package]
name    = "openkal-bind-tests"
version = "0.1.0"

[targets.openkal-bind-tests]
kind = "lib"

[build]
sources      = []
include_dirs = ["include"]

[dependencies.mcpplibs]
openkal-run = "0.1.3"

[build-dependencies.mcpplibs]
openkal-bind  = "0.1.3"
openkal-tools = { version = "0.1.3", tools = ["okld"] }

[xlings.workspace]
"xim:llvm" = "23.1.3"

[indices]
mcpplibs = { path = "../../.." }
