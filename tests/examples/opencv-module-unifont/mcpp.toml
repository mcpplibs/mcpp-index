# Public `opencv` module package `unifont` FEATURE test: `opencv = { features =
# ["unifont"] }` embeds the CJK font (no new module surface), so FontFace("uni")
# renders CJK through `import opencv.cv;`. Exercised on linux and macOS.
[package]
name    = "opencv-module-unifont-tests"
version = "0.1.0"

[indices]
default = { path = "../../.." }

[target.'cfg(linux)'.dependencies]
opencv = { version = "0.0.9", features = ["unifont"] }

[target.'cfg(macos)'.dependencies]
opencv = { version = "0.0.9", features = ["unifont"] }
