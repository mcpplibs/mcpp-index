[package]
name = "opencl-tests"
version = "0.1.0"

# The loader on every platform it has one, and on Linux the runtime adapter it
# depends on. The adapter is what lets the loader's dlopen of a host ICD resolve
# from inside mcpp's own C library; on a runner with no driver it is empty and
# the loader reports zero platforms.
#
# WINDOWS NEEDS NO ADAPTER AND IS NOT A SKIP ANY MORE. The loader reads the
# registry, DXGK and app packages there, and each entry names a driver DLL by
# absolute path that the SYSTEM loader resolves. `compat.opencl` gained its
# windows section for that reason; the test below is the same source on all
# three platforms.
[dependencies.compat]
opencl = "2026.05.29"

[build]
cxxflags = ["-DHAVE_OPENCL_LOADER=1"]
