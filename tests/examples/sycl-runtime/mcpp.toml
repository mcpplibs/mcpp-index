# compat.sycl-runtime is a Linux-only adapter, and for the same reason
# compat.cuda-driver is: an mcpp binary on Linux runs under mcpp's own loader,
# so a soname that is not on its runtime search path is not found at all. macOS
# and Windows have neither that loader arrangement nor this payload, so the
# dependency is conditioned rather than the member being excluded -- the member
# still builds on all three, which is what keeps the test source from rotting.
[package]
name    = "sycl-runtime-tests"
version = "0.1.0"

[target.'cfg(linux)'.dependencies.compat]
sycl-runtime = "2026.09.07"
