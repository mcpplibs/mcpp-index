# compat.cuda-driver is a Linux-only adapter: the problem it solves is that an
# mcpp binary on Linux runs under mcpp's own loader and therefore cannot see the
# host's driver. macOS and Windows have neither that loader arrangement nor an
# NVIDIA userspace driver in this shape, so the dependency is conditioned rather
# than the member being excluded — the member still builds on all three, which
# is what keeps the test source itself from rotting.
#
# ⚠️ `cuda-runtime` IS DECLARED ALONGSIDE IT, AND THAT IS THE POINT. The adapter
# shipped once under that name and the entry is kept so consumers already
# writing it keep resolving. A promise nothing exercises is a promise that
# breaks quietly, so this member depends on both and the build proves the old
# name still reaches a package. Two farms of the same symlink are harmless: the
# capability is not exclusive and the artifact's search path lists both.
[package]
name    = "cuda-driver-tests"
version = "0.1.0"

[target.'cfg(linux)'.dependencies.compat]
cuda-driver  = "2026.09.05"
cuda-runtime = "2026.09.05"
