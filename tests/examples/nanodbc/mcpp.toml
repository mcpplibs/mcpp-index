# nanodbc test project: assert the ODBC driver manager round-trips through the
# wrapper. CI has no database and no ODBC driver, but it has the driver manager
# (unixODBC on linux), which is exactly the layer nanodbc wraps -- so the
# behavioral assertion drives the ERROR path: connecting to a DSN that does
# not exist must throw nanodbc::database_error carrying the manager's own
# diagnostics.
#
# Windows uses the SDK driver manager. macOS uses the system iODBC runtime
# and requires libiodbc development headers (brew install libiodbc).
[package]
name = "nanodbc-tests"
version = "0.1.0"

[dependencies.compat]
nanodbc = "2.14.0"

[target.'cfg(linux)'.build]
cxxflags = ["-DHAVE_NANODBC=1"]
