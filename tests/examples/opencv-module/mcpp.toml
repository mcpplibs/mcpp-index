# Public `opencv` C++23-module package test (bare-name consumption from the
# builtin default namespace — resolved against THIS checkout via the
# workspace-root `[indices]` redirect, which every member inherits).
# Since opencv 0.0.7 the package is single-repo: the OpenCV sources are
# vendored in its own release tarball, so this member exercises the whole
# source build on all three platforms.
# Overrides the workspace-root redirect: root declares `compat`, this member
# needs `default`. A member-level [indices] REPLACES the inherited table rather
# than merging with it, which is what keeps this to ONE project index repo —
# two repos pointing at the same tree make every lookup ambiguous.
[indices]
opencv = { path = "../../.." }

[package]
name    = "opencv-module-tests"
version = "0.1.0"

# The package's only remaining transitive dep is compat.ffmpeg (videoio
# backend), which resolves from the GLOBAL published compat index: this
# member redirects `default`, and a member-level [indices] replaces the
# root's `compat` rather than adding to it. The compat descriptor itself is
# pre-merge-validated by its own dedicated member.
[target.'cfg(linux)'.dependencies.opencv]
opencv = "5.0.0"

[target.'cfg(macos)'.dependencies.opencv]
opencv = "5.0.0"

# windows: import opencv.cv on windows-x86_64 (clang-cl; module tarball OS-neutral).
[target.'cfg(windows)'.dependencies.opencv]
opencv = "5.0.0"
