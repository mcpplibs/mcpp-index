# spdlog test project: consumes compat.spdlog in its DEFAULT header-only mode
# (bundled fmt, no external dependency) and asserts behavior under `mcpp test`.
# Part of the mcpp-index self-referential workspace: the workspace-root
# `[indices]` redirect points at this repo, so the dependency resolves to the
# checked-in recipe
# (pkgs/c/compat.spdlog.lua). Compiled mode is covered by the sibling member
# tests/examples/spdlog-compiled/.
[package]
name = "spdlog-tests"
version = "0.1.0"

[dependencies.compat]
spdlog = "1.17.0"

# The candidate index: this checkout (compat.*), not the published one.
[indices]
compat = { path = "../../.." }
