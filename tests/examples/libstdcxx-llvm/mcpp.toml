# gcc.libstdcxx: libstdc++ as the C++ library of an llvm build (mcpp SPEC-002
# §7, mcpp 2026.10.26.1). The compiler is clang; the headers, the `std` module
# and the library come from the GCC payload the package links. Linux only, as
# the package is; elsewhere the member builds with the leg's own toolchain and
# its test asserts nothing about the C++ library.
[package]
name    = "libstdcxx-llvm-tests"
version = "0.1.0"
mcpp    = ">=2026.10.26.1"

[toolchain]
linux = "llvm@23.1.3"

[indices]
gcc = { path = "../../.." }

[target.'cfg(linux)'.dependencies.gcc]
libstdcxx = "16.1.0.1"
