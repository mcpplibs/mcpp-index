# EGL test project.
#
# THIS MEMBER DECLARES ITS OWN [indices], and has to. The workspace root maps
# the `compat` namespace to this checkout, and an index is looked up BY
# NAMESPACE — so `freedesktop.*` would resolve against the published index
# rather than the package under test. A member-level table REPLACES the root's
# rather than merging.
[indices]
freedesktop = { path = "../../.." }

[package]
name     = "egl-tests"
version  = "0.1.0"
standard = "c++23"

# Linux-only like its neighbours; the test compiles to a no-op main() elsewhere.
[target.'cfg(linux)'.dependencies.freedesktop]
egl = "1.7.0"
