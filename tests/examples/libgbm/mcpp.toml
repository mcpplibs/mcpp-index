# libgbm test project.
#
# GBM is the DRM buffer-management API, so like tests/examples/libaio the
# descriptor has a `linux` section and nothing else, the dependency is gated,
# and the test compiles to a no-op main() elsewhere.
#
# What this member proves is not "does -lgbm resolve". compat.libgbm is a thin
# BINDING onto the ecosystem's Mesa — it compiles no upstream source and sets
# no environment — so the interesting failures are all in the seams:
#
#   * the header could come from a different Mesa than the library (both are
#     taken from the same subos view precisely so they cannot);
#   * the backend directory could be unreachable, which is the default state of
#     an mcpp sandbox — Mesa compiles `/usr/lib/gbm` in as its search path and
#     that does not exist there;
#   * and the repair for that lives OUTSIDE this repository: `xim:mesa`
#     declares GBM_BACKENDS_PATH through the graphics discovery layer, and mcpp
#     carries subos declarations into the processes it launches.
#
# That last point is why this member matters more than a link check: it is the
# only place in this repo that notices if either of those two breaks.
#
# Two binaries, deliberately:
#
#   tests/gbm.cpp          the full surface — format canonicalization through
#                          the real library, symbol presence, invalid-device
#                          handling, and the backend-path assertions.
#   tests/stock_usage.cpp  the minimal consumer: one header, one library,
#                          nothing else. Smallest thing that still detects all
#                          three regressions above, so a failure is unambiguous.
#
# Everything asserted here runs on a CI runner with no /dev/dri. Real device
# creation is opt-in behind MCPP_RUN_GBM_DEVICE=1.
[package]
name = "libgbm-tests"
version = "0.1.0"

[target.'cfg(linux)'.dependencies.compat]
libgbm = "2026.08.29"
