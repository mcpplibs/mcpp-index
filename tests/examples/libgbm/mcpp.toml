# libgbm test project.
#
# GBM is the DRM buffer-management API, so like tests/examples/libaio the
# descriptor has a `linux` section and nothing else, the dependency is gated,
# and the test compiles to a no-op main() elsewhere.
#
# What this member has to prove is not "does -lgbm resolve". compat.libgbm is a
# BINDING onto the ecosystem's Mesa, and it can be wrong in three ways that all
# still link:
#
#   * the header could come from a different Mesa than the library;
#   * the backend directory could be unreachable, which is the state every
#     mcpp sandbox is in by default (Mesa compiles in /usr/lib/gbm, which does
#     not exist there) and which no link check would notice;
#   * the repair could require the CONSUMER to opt in, which would make it
#     worthless — libgbm is mostly called from inside other libraries (SDL2's
#     KMSDRM backend, wlroots, ffmpeg's VAAPI hwcontext) that will never call
#     a helper of ours.
#
# Hence TWO test binaries, and the split is deliberate:
#
#   tests/gbm.cpp          the full surface, including the optional
#                          introspection header.
#   tests/stock_usage.cpp  includes STOCK <gbm.h> and nothing else. If the
#                          backend path ever regresses to something the
#                          application has to ask for, this one fails while
#                          gbm.cpp could still pass.
#
# Everything asserted here runs on a CI runner with no /dev/dri. Real device
# creation is opt-in behind MCPP_RUN_GBM_DEVICE=1.
[package]
name = "libgbm-tests"
version = "0.1.0"

[target.'cfg(linux)'.dependencies.compat]
libgbm = "2026.08.29"
