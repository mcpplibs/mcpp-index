# A member-level redirect replaces the workspace root's compat redirect, so
# this test resolves huxerui.huxerui from the current checkout.
[indices]
huxerui = { path = "../../.." }

[package]
name    = "huxerui-module-tests"
version = "0.1.0"
# C++23, matching upstream v0.5.5's `standard = "c++23"` (`huxerui.rules`
# imports C++23 `mcpp:plugins` modules, and Clang requires C++23 for
# `import std;` on Windows). mcpp applies the root's standard to the module graph.
standard = "c++23"

[dependencies.huxerui]
huxerui = "0.5.5"
