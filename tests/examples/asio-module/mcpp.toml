# Asio C++23-module consumer test project: `import std; import asio;`.
# The public package is `chriskohlhoff.asio@1.38.1` (module-only).
# Overrides the workspace-root redirect: root declares `compat`, this member
# needs `chriskohlhoff`. A member-level [indices] REPLACES the inherited table rather
# than merging with it, which is what keeps this to ONE project index repo —
# two repos pointing at the same tree make every lookup ambiguous.
[indices]
chriskohlhoff = { path = "../../.." }

[package]
name = "asio-module-tests"
version = "0.1.0"

[dependencies.chriskohlhoff]
asio = "1.38.1"

[dependencies.fmtlib]
fmt = "12.2.0"
