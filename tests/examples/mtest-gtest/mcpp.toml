# mcpplibs.mtest.gtest test project: GoogleTest's cases begun by the adapter's main, which reports
# them by the mtest protocol. compat.gtest is named too, so an mcpp before 2026.11.8.1 leaves its
# gtest_main.cc out of a test that begins at the adapter.
[package]
name    = "mtest-gtest-tests"
version = "0.1.0"

[indices]
# Use the complete candidate built-in index prepared by tests/run_members.sh.

[dev-dependencies]
compat.gtest         = "1.18.0"
mcpplibs.mtest.gtest = "0.5.1"

[test]
main = { from = "mcpplibs.mtest.gtest/main" }
